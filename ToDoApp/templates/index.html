<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do LIst</title>

    <style>
        
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
    /* headings */
        h2 {
            text-align: center;
        }
        /* input fields */
        input {
            padding: 10px;
            width: 65%;
            border-radius: 6px;
        }
        /* all buttons */
        button {
            padding: 10px;
            cursor: pointer;
        }
        /* task comtainer */
        .tasks{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid black;
        }
        /* task title */
        .tasks-title{
            cursor: pointer;
            flex:1;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            font-size: 20px;
        }
        /* todo complete strike through */
        .completed {
            text-decoration: line-through;
            font-style: italic;
            color: red;
        }

        a{
            text-decoration: none;
            margin-left: 8px;
            color: black;
        }
        /* delete button */
        .delete{
            color: red;
            border: 1px solid darkred;
            padding: 10px;
            border-radius: 4px;
        }
        /* edit button */
        .edit{
            color:green;
            border: 1px solid darkseagreen;
            padding: 10px;
            border-radius: 4px;
        }
        /* add buton */
        .add{
            color:blue;
            border: 1px solid darkslateblue;
            padding: 10px;
            border-radius: 4px;
        }
        /* cancel button */
        .cancel{
            position: absolute;
            margin-top: 10px;
            color:grey;
            border: 1px solid darkslategrey;
            padding: 10px;
            border-radius: 4px;
        }


    </style>


</head>
<body>
    <div class="container">

        <h2>Works To Note Down</h2>

        {% if edit_task %}

            <form method="POST" action="{% url 'update' edit_task.id %}">
                {% csrf_token %}

                <input type="text" name="title" value="{{ edit_task.title }}" required >

                <button type="submit">Update</button>

            </form>

            <a href="{% url 'index' %}" class="cancel">Cancel</a>

        {% else %}

            <form method="POST">
                {% csrf_token %}

                <input type="text" name="title" placeholder="Enter a new Todo" required>

                <button type="submit" class="add">Add</button>

            </form>

        {% endif %}

        <!-- Display the TODOList -->

        <h2> Task To Done </h2>

        {% for task in tasks %}

        <div class="tasks">

            <a href="{% url 'complete' task.id %}" class="tasks-title {% if task.complete %} completed {% endif %}"> {{ task.title }}</a>

            <div>

                <a href="{% url 'index' %}?edit={{ task.id }}" class="edit">Edit</a>

                <a href="{% url 'delete' task.id %}"class="delete">Delete</a>
                
            </div>


        </div>

        {% empty %}

            <p>NO Records Found! Add your task first</p>
        
        {% endfor %}

    </div>
    
</body>
</html>
